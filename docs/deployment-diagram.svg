<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Task Management System — Deployment Architecture</title>
  <desc>GitHub repository triggers GitHub Actions CI/CD, which deploys a Node build and a Docker build of both frontend and backend to Cloudflare Pages and Render. The user's browser accesses both frontend variants, each of which talks to its matching backend over REST and WebSocket. Both backends share the same Supabase PostgreSQL database, Supabase Storage, and Resend email service.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#FFFFFF"/>

  <!-- Row 0: GitHub repo -> GitHub Actions -->
  <g>
    <rect x="90" y="30" width="200" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="190" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">GitHub repository</text>
    <text x="190" y="67" text-anchor="middle" font-size="11" fill="#534AB7">develop branch</text>
  </g>
  <line x1="290" y1="55" x2="328" y2="55" stroke="#7C3AED" stroke-width="1.3" marker-end="url(#arrowDashed)"/>
  <g>
    <rect x="330" y="30" width="220" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="440" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">GitHub Actions (CI/CD)</text>
    <text x="440" y="67" text-anchor="middle" font-size="11" fill="#534AB7">install · lint · build · test</text>
  </g>

  <!-- User / Browser -->
  <g>
    <rect x="620" y="30" width="200" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
    <text x="720" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">User&#8217;s browser</text>
    <text x="720" y="67" text-anchor="middle" font-size="11" fill="#475569">HTTPS + WebSocket (WSS)</text>
  </g>

  <!-- CI deploy arrow, terminating between the two frontend lanes -->
  <line x1="440" y1="80" x2="440" y2="148" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <text x="452" y="118" font-size="11" fill="#534AB7">auto-deploy on every push</text>

  <!-- Dashed fan from CI termination point to both frontend boxes -->
  <path d="M440 150 L245 168" fill="none" stroke="#7C3AED" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <path d="M440 150 L645 168" fill="none" stroke="#7C3AED" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>

  <!-- User to both frontends -->
  <path d="M690 80 L245 168" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M730 80 L645 168" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Row 2: Frontend lanes -->
  <g>
    <rect x="80" y="170" width="330" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="245" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Cloudflare Pages</text>
    <text x="245" y="208" text-anchor="middle" font-size="11" fill="#185FA5">Frontend — Node build (primary)</text>
    <text x="245" y="224" text-anchor="middle" font-size="10.5" fill="#378ADD" font-family="Consolas, monospace">taskify.task-management-system.best</text>
  </g>
  <g>
    <rect x="480" y="170" width="330" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="645" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Render</text>
    <text x="645" y="208" text-anchor="middle" font-size="11" fill="#185FA5">Frontend — Docker build (demo)</text>
    <text x="645" y="224" text-anchor="middle" font-size="10.5" fill="#378ADD" font-family="Consolas, monospace">taskifyd.task-management-system.best</text>
  </g>

  <!-- Frontend -> Backend -->
  <line x1="245" y1="242" x2="245" y2="280" stroke="#0F766E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="255" y="265" font-size="10.5" fill="#0F766E">REST API + Socket.io</text>
  <line x1="645" y1="242" x2="645" y2="280" stroke="#0F766E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="655" y="265" font-size="10.5" fill="#0F766E">REST API + Socket.io</text>

  <!-- Row 3: Backend lanes -->
  <g>
    <rect x="80" y="280" width="330" height="72" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.2"/>
    <text x="245" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Render</text>
    <text x="245" y="318" text-anchor="middle" font-size="11" fill="#0F6E56">Backend API — Node build (primary)</text>
    <text x="245" y="334" text-anchor="middle" font-size="10.5" fill="#1D9E75" font-family="Consolas, monospace">task-management-system-backend-spcl</text>
  </g>
  <g>
    <rect x="480" y="280" width="330" height="72" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.2"/>
    <text x="645" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Render (Docker)</text>
    <text x="645" y="318" text-anchor="middle" font-size="11" fill="#0F6E56">Backend API — Docker build (demo)</text>
    <text x="645" y="334" text-anchor="middle" font-size="10.5" fill="#1D9E75" font-family="Consolas, monospace">task-management-system-6936</text>
  </g>

  <!-- Backends -> shared services -->
  <path d="M245 352 L320 408" fill="none" stroke="#92400E" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M645 352 L650 408" fill="none" stroke="#92400E" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M245 352 L650 408" fill="none" stroke="#92400E" stroke-width="1" opacity="0.55" marker-end="url(#arrow)"/>
  <path d="M645 352 L320 408" fill="none" stroke="#92400E" stroke-width="1" opacity="0.55" marker-end="url(#arrow)"/>

  <!-- Row 4: shared services -->
  <g>
    <rect x="190" y="410" width="260" height="70" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
    <text x="320" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Supabase</text>
    <text x="320" y="448" text-anchor="middle" font-size="11" fill="#854F0B">PostgreSQL database</text>
    <text x="320" y="464" text-anchor="middle" font-size="10.5" fill="#B45309">shared by both backend variants</text>
  </g>
  <g>
    <rect x="520" y="410" width="260" height="70" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
    <text x="650" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Supabase Storage + Resend</text>
    <text x="650" y="448" text-anchor="middle" font-size="11" fill="#854F0B">file attachments + transactional email</text>
    <text x="650" y="464" text-anchor="middle" font-size="10.5" fill="#B45309">shared by both backend variants</text>
  </g>

  <!-- Legend -->
  <line x1="90" y1="525" x2="130" y2="525" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="138" y="529" font-size="11" fill="#334155">runtime traffic (HTTPS / WSS / SQL)</text>
  <line x1="400" y1="525" x2="440" y2="525" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <text x="448" y="529" font-size="11" fill="#334155">CI/CD auto-deploy on push</text>
</svg>
